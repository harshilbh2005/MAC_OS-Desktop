<head>

<title>macOS Desktop Recording Script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a teleprompter. One step fills the screen: big code on the left, what the
   browser should show on the right, a slim progress header on top. Arrow keys move
   between steps. Same look as the Lock Screen (video 1) and Donut & Cube (video 2)
   scripts, so every script in the series feels the same.
   Deliberately dark-only: it sits beside a dark recording setup in a dim room. */
:root {
  color-scheme: dark;
  --ink: #0f0e13;
  --panel: #17151d;
  --raised: #201d28;
  --line: #2e2a38;
  --text: #ece8f2;
  --muted: #a29bb0;
  --faint: #6f6880;
  --lamp: #ffb86b;
  --lamp-ink: #2a1a08;
  --dusk: #9d8dff;
  --icing: #ff8cc3;
  --term: #181818;
  --ok: #8fe0b0;
  --f-html: #ff9f7a;
  --f-css: #8fc7ff;
  --f-gl: #c9bcff;
  --f-js: #ffd27a;
  --sx-keyword: #ff9f7a;
  --sx-string: #9ee6b7;
  --sx-number: #ffd27a;
  --sx-comment: #757087;
  --sx-punct: #b4adc2;
  --sx-fn: #ffcf8a;
  --sx-tag: #ff9f7a;
  --sx-attr: #c9bcff;
  --sx-prop: #8fc7ff;
  --font-ui: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --code-size: 16px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--ink);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
code { font-family: var(--font-code); font-size: .92em; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* Header */
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ink);
  padding-block: 14px 12px;
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rec { width: 10px; height: 10px; border-radius: 50%; background: #ff5a4f; box-shadow: 0 0 0 4px rgba(255,90,79,.15); flex-shrink: 0; }
.brand h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
.where-now { color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 200px; }
.controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
}
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--lamp); color: var(--lamp-ink); border-color: var(--lamp); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .4; cursor: default; }
kbd {
  font-family: var(--font-code); font-size: 12px; line-height: 1;
  padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line);
  border-bottom-width: 3px; background: var(--raised); color: var(--muted);
}
.btn.primary kbd { background: rgba(0,0,0,.12); border-color: rgba(0,0,0,.25); color: var(--lamp-ink); }
.progress { height: 4px; background: var(--raised); border-radius: 4px; margin-top: 12px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--lamp); transition: width .25s; }

/* Step view */
main { padding-block: 22px 0; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 28px; align-items: start; }
.eyebrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.eyebrow .chap { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--dusk); }
.file {
  font-family: var(--font-code); font-size: 13px; padding: 2px 8px; border-radius: 6px;
  border: 1px solid currentColor; color: var(--f-js);
}
.file[data-file="index.html"] { color: var(--f-html); }
.file[data-file="style.css"] { color: var(--f-css); }
.file[data-file="wallpaper.js"] { color: var(--f-gl); }
.long { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--raised); color: var(--icing); font-weight: 600; }
.step h2 { font-size: 28px; line-height: 1.2; margin: 8px 0 6px; text-wrap: balance; }
.where { color: var(--text); font-size: 16px; margin: 0 0 14px; max-width: 72ch; }
.where b { color: var(--lamp); font-weight: 600; }

.code {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  overflow: hidden;
}
.ctx {
  display: flex; gap: 12px; align-items: baseline; padding: 10px 16px;
  background: var(--raised); border-bottom: 1px solid var(--line);
  font-family: var(--font-code); font-size: calc(var(--code-size) * .8); color: var(--faint);
  overflow-x: auto; white-space: pre;
}
.ctx.before { border-top: 1px solid var(--line); border-bottom: none; }
.ctx .tag { font-family: var(--font-ui); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); flex-shrink: 0; }
.ctx.replace .old { text-decoration: line-through; text-decoration-color: #ff5a4f; }
.lines { display: flex; overflow-x: auto; }
.gutter, .src {
  margin: 0; padding: 16px 0; font-family: var(--font-code);
  font-size: var(--code-size); line-height: 1.6; white-space: pre;
}
.gutter { padding-inline: 14px 12px; color: var(--faint); text-align: right; user-select: none; border-right: 1px solid var(--line); flex-shrink: 0; }
.src { padding-inline: 16px 24px; color: var(--text); tab-size: 2; }
.src code { font: inherit; }

.side { display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.card p { margin: 0; }
.shot { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 10px; margin-top: 10px; background: var(--term); border: 1px solid var(--line); }
.run {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px;
  padding: 10px 12px; border-radius: 8px; background: var(--term); border: 1px solid var(--line);
}
.run .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--ok); font-weight: 600; }
.run .keys { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.run .hint { flex-basis: 100%; }
.meta-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); }
.meta-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Intro and finish */
.panel-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.stack > * { min-width: 0; }
.intro h2 { font-size: 34px; line-height: 1.15; margin: 4px 0 10px; text-wrap: balance; max-width: 22ch; }
.lede { color: var(--muted); font-size: 17px; max-width: 62ch; margin: 0; }
.vtitle { font-family: var(--font-code); font-size: 15px; background: var(--panel); border: 1px dashed var(--line); padding: 10px 12px; border-radius: 8px; overflow-wrap: anywhere; }
.vtitle + .vtitle { margin-top: 8px; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.checks input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--lamp); }
.checks label { cursor: pointer; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.speed { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0 12px; }
.speed input { width: 80px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text); }
.hint { color: var(--faint); font-size: 13px; }
pre.plain { margin: 0; font-family: var(--font-code); font-size: 14px; line-height: 1.6; white-space: pre-wrap; color: var(--text); overflow-wrap: anywhere; }
.copy-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.copy-row h3 { margin: 0; }
.shots-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.shots-row figure { margin: 0; min-width: 0; }
.shots-row figure:first-child { grid-column: 1 / -1; }
.shots-row figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
.shorts { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.shorts b { color: var(--icing); font-weight: 600; }

/* Overview drawer */
.overview { margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.overview .card h3 { color: var(--dusk); }
.overview ol { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; }
.overview button {
  width: 100%; text-align: left; background: none; border: none; padding: 5px 6px; border-radius: 6px; cursor: pointer;
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 6px; font-size: 14px; color: var(--muted);
}
.overview button:hover { background: var(--raised); color: var(--text); }
.overview button.current { background: var(--raised); color: var(--lamp); }
.overview .n { font-variant-numeric: tabular-nums; color: var(--faint); }
.overview .f { font-size: 12px; color: var(--ok); }

/* Syntax colours: HTML, CSS and JavaScript */
.token.comment { color: var(--sx-comment); font-style: italic; }
.token.punctuation, .token.operator { color: var(--sx-punct); }
.token.keyword, .token.atrule, .token.important { color: var(--sx-keyword); }
.token.string, .token.template-string, .token.attr-value { color: var(--sx-string); }
.token.number, .token.boolean, .token.unit { color: var(--sx-number); }
.token.function { color: var(--sx-fn); }
.token.tag { color: var(--sx-tag); }
.token.attr-name, .token.selector, .token.class-name { color: var(--sx-attr); }
.token.property, .token.entity { color: var(--sx-prop); }
.token.interpolation .token.punctuation { color: var(--sx-keyword); }
.token.template-string .token.string { color: var(--sx-string); }

@media (max-width: 960px) {
  .step, .panel-grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .step h2 { font-size: 24px; }
  .intro h2 { font-size: 28px; }
  .where-now { flex-basis: 100%; order: 3; }
  .controls { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .progress i { transition: none; }
}
</style>

wallpaper canvas","file":"style.css","op":"create","anchor":null,"where":"Empty file. --hue is the wallpaper colour; System Settings changes it later.","code":"/* ---- Base ---- */\n\n* {\n  margin: 0;\n  padding: 0;\n  box-sizing: border-box;\n}\n\n[hidden] {\n  display: none !important;\n}\n\n:root {\n  --hue: 0deg;\n  --text: rgba(255, 255, 255, 0.92);\n  --muted: rgba(255, 255, 255, 0.62);\n  --blue: #0a84ff;\n  --font: -apple-system, BlinkMacSystemFont, \"Inter\", \"Segoe UI\", sans-serif;\n  --mono: \"SF Mono\", Menlo, \"JetBrains Mono\", monospace;\n}\n\nbody {\n  height: 100vh;\n  overflow: hidden;\n  font-family: var(--font);\n  color: var(--text);\n  background: #000;\n  user-select: none;\n  -webkit-font-smoothing: antialiased;\n}\n\nbutton {\n  font: inherit;\n  color: inherit;\n  background: none;\n  border: none;\n}\n\ninput,\ntextarea {\n  user-select: text;\n}\n\n.lucide {\n  width: 1em;\n  height: 1em;\n}\n\n/* ---- Wallpaper ---- */\n\n.wallpaper {\n  position: fixed;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  filter: hue-rotate(var(--hue));\n  transition: filter 1.5s;\n}","preview":"Nothing to run yet. The page is still black.","run":false,"lines":58,"typed":49,"shot":null},{"n":3,"chapter":"Live wallpaper","chapterIndex":1,"title":"The shader: colours of the ribbons","file":"wallpaper.js","op":"create","anchor":null,"where":"Empty file. The shader is a program for the graphics card, written in GLSL and kept in a JavaScript string. The backtick on the SHADER line opens that string.","code":"// Live wallpaper. A WebGL shader paints glowing ribbons of silk, one pixel at a time,\n// sixty times a second, in the style of the newest macOS wallpapers.\n\nconst SHADER = `\nprecision highp float;\nuniform vec2 size;\nuniform float time;\n\n// The colour of a ribbon, from the back (0.0) to the front (1.0)\nvec3 tint(float k) {\n  vec3 indigo = vec3(0.32, 0.30, 0.95);\n  vec3 blue = vec3(0.10, 0.42, 1.00);\n  vec3 cyan = vec3(0.35, 0.85, 1.00);\n  vec3 navy = vec3(0.05, 0.12, 0.45);\n  if (k \u003c 0.33) return mix(indigo, blue, k / 0.33);\n  if (k \u003c 0.66) return mix(blue, cyan, (k - 0.33) / 0.33);\n  return mix(cyan, navy, (k - 0.66) / 0.34);\n}","preview":"Nothing to run yet.","run":false,"lines":18,"typed":16,"shot":null},{"n":4,"chapter":"Live wallpaper","chapterIndex":1,"title":"The shader: six ribbons of light","file":"wallpaper.js","op":"append","anchor":null,"where":"At the end of wallpaper.js. Start with an empty line. It runs once for every pixel. The last line closes the string with a backtick.","code":"\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / size;   // 0,0 is bottom left, 1,1 is top right\n  float x = uv.x * size.x / size.y;\n  float t = time * 0.05;\n\n  // The dark night behind the ribbons\n  vec3 color = mix(vec3(0.0, 0.01, 0.05), vec3(0.01, 0.04, 0.14), uv.y);\n\n  for (int i = 0; i \u003c 6; i++) {\n    float n = float(i);\n    float k = n / 5.0;\n\n    // Where the top edge of this ribbon is\n    float edge = 0.78 - k * 0.42 + 0.22 * (x - 0.8) * (1.0 - k * 0.4)\n      + 0.10 * sin(x * (1.6 + k * 0.5) + n * 2.1 + t * (1.0 + k))\n      + 0.03 * sin(x * 4.0 - n * 1.3 - t * 1.7);\n    float d = edge - uv.y;   // more than 0 means we are inside the ribbon\n\n    // A soft shadow on the ribbons behind it\n    float shadow = (1.0 - smoothstep(0.0, 0.25, -d)) * step(d, 0.0);\n    color *= 1.0 - 0.45 * shadow;\n\n    // The ribbon: see-through silk with a bright line of light along its edge\n    vec3 c = tint(k);\n    vec3 silk = c * 0.55 * exp(-d * 4.5) + c * 0.08;\n    silk += mix(c, vec3(1.0), 0.6) * 0.9 * exp(-d * 90.0);\n    color = mix(color, silk + color * 0.25, smoothstep(0.0, 0.002, d));\n\n    // A faint glow around the edge\n    color += c * 0.12 * exp(-abs(d) * 30.0);\n  }\n\n  // Darker corners and a little film grain\n  color *= 1.0 - 0.3 * length(uv - vec2(0.5, 0.6));\n  color += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.025;\n  gl_FragColor = vec4(color, 1.0);\n}`;","preview":"Nothing to run yet.","run":false,"lines":38,"typed":30,"shot":null},{"n":5,"chapter":"Live wallpaper","chapterIndex":1,"title":"Hand the shader to WebGL","file":"wallpaper.js","op":"append","anchor":null,"where":"At the end of wallpaper.js. Start with an empty line.","code":"\nconst canvas = document.getElementById(\"wallpaper\");\nconst gl = canvas.getContext(\"webgl\");\n\nfunction compile(type, source) {\n  const shader = gl.createShader(type);\n  gl.shaderSource(shader, source);\n  gl.compileShader(shader);\n  return shader;\n}\n\nconst program = gl.createProgram();\ngl.attachShader(program, compile(gl.VERTEX_SHADER,\n  \"attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }\"));\ngl.attachShader(program, compile(gl.FRAGMENT_SHADER, SHADER));\ngl.linkProgram(program);\ngl.useProgram(program);\n\n// One big triangle that covers the whole screen\ngl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());\ngl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);\ngl.enableVertexAttribArray(0);\ngl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);\n\nconst sizeSlot = gl.getUniformLocation(program, \"size\");\nconst timeSlot = gl.getUniformLocation(program, \"time\");","preview":"Nothing to run yet. One more step.","run":false,"lines":26,"typed":21,"shot":null},{"n":6,"chapter":"Live wallpaper","chapterIndex":1,"title":"Paint every frame, then the first run","file":"wallpaper.js","op":"append","anchor":null,"where":"At the end of wallpaper.js. Start with an empty line. Type it exactly like this. It hides bug 1, which you fix in the next step.","code":"\nfunction paint(ms) {\n  gl.uniform2f(sizeSlot, canvas.width, canvas.height);\n  gl.uniform1f(timeSlot, ms / 1000);\n  gl.drawArrays(gl.TRIANGLES, 0, 3);\n  requestAnimationFrame(paint);\n}\n\nrequestAnimationFrame(paint);","preview":"Deep blue ribbons of light drift very slowly across a dark sky. Bug 1: they look blurry and blocky. The canvas never got a size, so the browser stretches its default 300 × 150 pixels over the whole screen.","run":true,"lines":9,"typed":7,"shot":"shots/step06.jpg"},{"n":7,"chapter":"Live wallpaper","chapterIndex":1,"title":"Bug 1: the wallpaper is blurry","file":"wallpaper.js","op":"replace_line","anchor":"  gl.uniform2f(sizeSlot, canvas.width, canvas.height);","where":"In paint(), replace the gl.uniform2f line. Now the canvas matches the window, pixel for pixel, even on a Retina screen.","code":"  const width = Math.round(innerWidth * devicePixelRatio);\n  const height = Math.round(innerHeight * devicePixelRatio);\n  if (canvas.width !== width || canvas.height !== height) {\n    canvas.width = width;\n    canvas.height = height;\n    gl.viewport(0, 0, width, height);\n  }\n  gl.uniform2f(sizeSlot, width, height);","preview":"Sharp, see-through ribbons with a bright line of light along every edge and a fine film grain, like the newest macOS wallpapers. Resize the window: it stays sharp.","run":true,"lines":8,"typed":8,"shot":"shots/step07.jpg"},{"n":8,"chapter":"Menu bar","chapterIndex":2,"title":"Menu bar markup","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003c!-- Menu bar -->\n  \u003cheader class=\"menubar\">\n    \u003cnav class=\"menus\">\n      \u003cbutton class=\"logo\" data-menu=\"logo\">\u003ci data-lucide=\"command\">\u003c/i>\u003c/button>\n      \u003cb id=\"appName\">Finder\u003c/b>\n      \u003cbutton data-menu=\"file\">File\u003c/button>\n      \u003cbutton data-menu=\"view\">View\u003c/button>\n      \u003cbutton data-menu=\"go\">Go\u003c/button>\n      \u003cbutton data-menu=\"help\">Help\u003c/button>\n    \u003c/nav>\n    \u003cdiv class=\"status\">\n      \u003cspan>\u003ci data-lucide=\"wifi\">\u003c/i>\u003csmall id=\"speed\">\u003c/small>\u003c/span>\n      \u003cspan>\u003csmall id=\"battery\">100%\u003c/small>\u003ci class=\"battery\">\u003cb id=\"batteryLevel\">\u003c/b>\u003c/i>\u003c/span>\n      \u003cbutton id=\"searchButton\">\u003ci data-lucide=\"search\">\u003c/i>\u003c/button>\n      \u003cspan id=\"clock\">\u003c/span>\n    \u003c/div>\n  \u003c/header>\n","preview":"Nothing to run yet.","run":false,"lines":18,"typed":17,"shot":null},{"n":9,"chapter":"Menu bar","chapterIndex":2,"title":"Menu bar styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Menu bar ---- */\n\n.menubar {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  z-index: 10;\n  height: 28px;\n  padding: 0 8px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  font-size: 13px;\n  font-weight: 500;\n  background: rgba(0, 5, 20, 0.2);\n  backdrop-filter: blur(40px) saturate(180%);\n  text-shadow: 0 0 6px rgba(0, 0, 0, 0.25);\n}\n\n.menus,\n.status {\n  display: flex;\n  align-items: center;\n}\n\n.menus > *,\n.status > * {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  height: 22px;\n  padding: 0 10px;\n  border-radius: 5px;\n}\n\n.menus button:hover,\n.status button:hover {\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.logo {\n  font-size: 15px;\n}\n\n.status .lucide {\n  font-size: 15px;\n}\n\n.status small {\n  font-size: 12px;\n}","preview":"Nothing to run yet.","run":false,"lines":53,"typed":45,"shot":null},{"n":10,"chapter":"Menu bar","chapterIndex":2,"title":"A real battery icon","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line. The ::after is the little bump on the right.","code":"\n.battery {\n  position: relative;\n  width: 25px;\n  height: 12px;\n  padding: 1.5px;\n  border: 1px solid rgba(255, 255, 255, 0.5);\n  border-radius: 4px;\n}\n\n.battery::after {\n  content: \"\";\n  position: absolute;\n  top: 3px;\n  right: -4px;\n  width: 2px;\n  height: 4px;\n  border-radius: 0 2px 2px 0;\n  background: rgba(255, 255, 255, 0.5);\n}\n\n.battery b {\n  display: block;\n  width: 100%;\n  height: 100%;\n  border-radius: 2px;\n  background: #fff;\n}\n\n.battery.charging b {\n  background: #34c759;\n}","preview":"Nothing to run yet.","run":false,"lines":32,"typed":28,"shot":null},{"n":11,"chapter":"Menu bar","chapterIndex":2,"title":"The clock and the icons","file":"script.js","op":"create","anchor":null,"where":"Empty file. $ is a short name for document.getElementById.","code":"// A macOS desktop in the browser. Plain JavaScript, no frameworks.\n// Small icons come from Lucide: every \u003ci data-lucide=\"name\"> turns into an icon.\n\nconst $ = (id) => document.getElementById(id);\n\n// ---- Menu bar ----\n\nfunction tick() {\n  const now = new Date();\n  $(\"clock\").textContent = now\n    .toLocaleString(\"en-US\", {\n      weekday: \"short\", month: \"short\", day: \"numeric\", hour: \"numeric\", minute: \"2-digit\",\n    })\n    .replaceAll(\",\", \"\");\n}\n\ntick();\nsetInterval(tick, 1000);\nlucide.createIcons();","preview":"A see-through menu bar over the ribbons: the ⌘ logo, Finder, File, View, Go and Help on the left, Wi-Fi, a full battery, search and the live date and time on the right.","run":true,"lines":19,"typed":15,"shot":"shots/step11.jpg"},{"n":12,"chapter":"Menu bar","chapterIndex":2,"title":"Real Wi-Fi speed and battery level","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line.","code":"\n// Wi-Fi speed and battery level, straight from the browser\nfunction showSpeed() {\n  const speed = navigator.connection?.downlink;\n  $(\"speed\").textContent = speed ? speed + \" Mbps\" : \"\";\n}\n\nshowSpeed();\nnavigator.connection?.addEventListener(\"change\", showSpeed);\n\nnavigator.getBattery?.().then((battery) => {\n  function showBattery() {\n    const level = Math.round(battery.level * 100);\n    $(\"battery\").textContent = level + \"%\";\n    $(\"batteryLevel\").style.width = level + \"%\";\n    $(\"batteryLevel\").parentElement.classList.toggle(\"charging\", battery.charging);\n  }\n  showBattery();\n  battery.addEventListener(\"levelchange\", showBattery);\n  battery.addEventListener(\"chargingchange\", showBattery);\n});","preview":"The menu bar now shows your real network speed and battery level. The battery fills to the right width, and turns green while charging. (Chrome only, Safari keeps 100%.)","run":true,"lines":21,"typed":18,"shot":"shots/step12.jpg"},{"n":13,"chapter":"Weather widget","chapterIndex":3,"title":"Weather widget markup","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line. Close \u003c/main> right after the weather section; the other two widgets go in later.","code":"  \u003c!-- Widgets -->\n  \u003cmain class=\"widgets\">\n    \u003csection class=\"glass weather\">\n      \u003cdiv class=\"now\">\n        \u003cdiv>\n          \u003ch2>\u003cspan id=\"city\">Cupertino\u003c/span>\u003ci data-lucide=\"navigation\">\u003c/i>\u003c/h2>\n          \u003cp class=\"temp\" id=\"temp\">--°\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"sky\">\n          \u003cspan id=\"skyIcon\">\u003ci data-lucide=\"cloud\">\u003c/i>\u003c/span>\n          \u003cp id=\"skyText\">Loading...\u003c/p>\n          \u003csmall id=\"highLow\">H:--° L:--°\u003c/small>\n        \u003c/div>\n      \u003c/div>\n      \u003cul class=\"hours\" id=\"hours\">\u003c/ul>\n    \u003c/section>\n  \u003c/main>\n","preview":"Nothing to run yet.","run":false,"lines":18,"typed":17,"shot":null},{"n":14,"chapter":"Weather widget","chapterIndex":3,"title":"Frosted glass","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line. backdrop-filter blurs whatever is behind the element.","code":"\n/* ---- Glass ---- */\n\n.glass {\n  background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03));\n  backdrop-filter: blur(30px) saturate(170%) brightness(0.85);\n  border: 1px solid rgba(255, 255, 255, 0.22);\n  box-shadow:\n    inset 0 1px 1px rgba(255, 255, 255, 0.45),\n    inset 0 0 30px rgba(255, 255, 255, 0.06),\n    0 24px 60px rgba(0, 5, 25, 0.45);\n}","preview":"Nothing to run yet.","run":false,"lines":12,"typed":10,"shot":null},{"n":15,"chapter":"Weather widget","chapterIndex":3,"title":"Widget layout","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Widgets ---- */\n\n.widgets {\n  position: absolute;\n  top: 45%;\n  left: 50%;\n  translate: -50% -50%;\n  width: 500px;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 22px;\n  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.18);\n}\n\n.widgets > * {\n  aspect-ratio: 1;\n  padding: 22px;\n  border-radius: 30px;\n  transition: scale 0.4s cubic-bezier(0.2, 1.4, 0.4, 1);\n}\n\n.widgets > :hover {\n  scale: 1.02;\n}\n\n.weather {\n  grid-column: span 2;\n  aspect-ratio: auto;\n  padding: 24px 28px;\n}","preview":"Nothing to run yet.","run":false,"lines":31,"typed":26,"shot":null},{"n":16,"chapter":"Weather widget","chapterIndex":3,"title":"Weather widget styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n.now {\n  display: flex;\n  justify-content: space-between;\n}\n\n.now h2 {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 19px;\n  font-weight: 600;\n}\n\n.now h2 .lucide {\n  font-size: 12px;\n  fill: currentColor;\n}\n\n.temp {\n  font-size: 76px;\n  font-weight: 200;\n  line-height: 1.05;\n  letter-spacing: -3px;\n}\n\n.sky {\n  display: grid;\n  justify-items: end;\n  align-content: start;\n  gap: 2px;\n  font-size: 14px;\n  font-weight: 600;\n}\n\n.sky .lucide {\n  font-size: 30px;\n  margin: 4px 0 10px;\n}\n\n.hours {\n  list-style: none;\n  display: flex;\n  justify-content: space-between;\n  margin-top: 30px;\n}\n\n.hours li {\n  display: grid;\n  justify-items: center;\n  gap: 10px;\n  width: 44px;\n  font-size: 15px;\n  font-weight: 600;\n}\n\n.hours small {\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.hours .lucide {\n  font-size: 22px;\n}","preview":"A frosted glass card floats over the ribbons: Cupertino, --°, a cloud and Loading... The wallpaper glows through it.","run":true,"lines":64,"typed":54,"shot":"shots/step16.jpg"},{"n":17,"chapter":"Weather widget","chapterIndex":3,"title":"Live weather","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line. Type the deg line exactly like this, it is bug 2. Change CITY to your own city and its latitude and longitude. The ° sign is ⌥⇧8.","code":"\n// ---- Weather (free forecast from open-meteo.com, no key needed) ----\n\nconst CITY = { name: \"Cupertino\", lat: 37.32, lon: -122.03 };   // put your city here\n\n// Turn a weather code into words and an icon\nfunction sky(code, isDay) {\n  if (code === 0) return isDay ? [\"Sunny\", \"sun\"] : [\"Clear\", \"moon\"];\n  if (code \u003c= 2) return [\"Partly Cloudy\", isDay ? \"cloud-sun\" : \"cloud-moon\"];\n  if (code === 3) return [\"Cloudy\", \"cloud\"];\n  if (code \u003c= 48) return [\"Foggy\", \"cloud-fog\"];\n  if (code \u003c= 57) return [\"Drizzle\", \"cloud-drizzle\"];\n  if (code \u003c= 67 || (code >= 80 && code \u003c= 82)) return [\"Rain\", \"cloud-rain\"];\n  if (code \u003c= 86) return [\"Snow\", \"cloud-snow\"];\n  return [\"Thunderstorms\", \"cloud-lightning\"];\n}\n\nconst deg = (t) => t + \"°\";\n\nasync function loadWeather(announce) {\n  const url = \"https://api.open-meteo.com/v1/forecast\" +\n    `?latitude=${CITY.lat}&longitude=${CITY.lon}&timezone=auto&forecast_days=2` +\n    \"&current=temperature_2m,weather_code,is_day\" +\n    \"&hourly=temperature_2m,weather_code,is_day\" +\n    \"&daily=temperature_2m_max,temperature_2m_min\";\n  try {\n    const { current, hourly, daily } = await (await fetch(url)).json();\n    const [text, icon] = sky(current.weather_code, current.is_day);\n    $(\"city\").textContent = CITY.name;\n    $(\"temp\").textContent = deg(current.temperature_2m);\n    $(\"skyText\").textContent = text;\n    $(\"skyIcon\").innerHTML = `\u003ci data-lucide=\"${icon}\">\u003c/i>`;\n    $(\"highLow\").textContent =\n      `H:${deg(daily.temperature_2m_max[0])} L:${deg(daily.temperature_2m_min[0])}`;\n\n    // The next 6 hours, starting with this one\n    const first = hourly.time.findIndex((time) => time >= current.time.slice(0, 13));\n    let hours = \"\";\n    for (let i = first; i \u003c first + 6; i++) {\n      const [, hourIcon] = sky(hourly.weather_code[i], hourly.is_day[i]);\n      const time = new Date(hourly.time[i]).toLocaleTimeString(\"en-US\", { hour: \"numeric\" });\n      hours += `\u003cli>\n        \u003csmall>${i === first ? \"Now\" : time}\u003c/small>\n        \u003ci data-lucide=\"${hourIcon}\">\u003c/i>\n        \u003cspan>${deg(hourly.temperature_2m[i])}\u003c/span>\n      \u003c/li>`;\n    }\n    $(\"hours\").innerHTML = hours;\n    lucide.createIcons();\n    if (announce) notify(\"weather\", CITY.name, `${deg(current.temperature_2m)} and ${text.toLowerCase()}`);\n  } catch {\n    $(\"skyText\").textContent = \"Offline\";\n  }\n}\n\nloadWeather();\nsetInterval(loadWeather, 15 * 60 * 1000);   // every 15 minutes","preview":"The widget fills with live weather and the next 6 hours. Bug 2: the temperatures have decimals, like 27.6°, and the row looks messy.","run":true,"lines":57,"typed":50,"shot":"shots/step17.jpg"},{"n":18,"chapter":"Weather widget","chapterIndex":3,"title":"Bug 2: temperatures with decimals","file":"script.js","op":"replace_line","anchor":"const deg = (t) => t + \"°\";","where":"In the weather section, replace the deg line. Every temperature goes through deg(), so one fix rounds them all.","code":"const deg = (t) => Math.round(t) + \"°\";","preview":"Clean whole degrees everywhere: 28°, H:28° L:19°.","run":true,"lines":1,"typed":1,"shot":"shots/step18.jpg"},{"n":19,"chapter":"Weather widget","chapterIndex":3,"title":"Weather icons in colour","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* Weather icons in colour, like Apple's */\n.weather .lucide-sun,\n.weather .lucide-cloud-sun path:not(:last-child) {\n  color: #ffd23f;\n  fill: #ffd23f;\n}\n\n.weather .lucide-cloud,\n.weather .lucide-cloud-sun path:last-child,\n.weather .lucide-cloud-moon path:last-child,\n.weather .lucide-moon {\n  fill: currentColor;\n}","preview":"The suns turn yellow and the clouds fill in white, like Apple's Weather widget.","run":true,"lines":14,"typed":12,"shot":"shots/step19.jpg"},{"n":20,"chapter":"Cleaner, notes and notifications","chapterIndex":4,"title":"Two small widgets","file":"index.html","op":"insert_before_line","anchor":"  \u003c/main>","where":"In index.html, right above \u003c/main>. Start with an empty line.","code":"\n    \u003csection class=\"glass cleaner\" id=\"cleaner\">\n      \u003cdiv class=\"ring\">\n        \u003csvg viewBox=\"0 0 100 100\">\n          \u003ccircle cx=\"50\" cy=\"50\" r=\"44\">\u003c/circle>\n          \u003ccircle cx=\"50\" cy=\"50\" r=\"44\" pathLength=\"100\" id=\"ring\">\u003c/circle>\n        \u003c/svg>\n        \u003ci data-lucide=\"trash-2\">\u003c/i>\n      \u003c/div>\n      \u003cp id=\"cleanText\">Tap to clean\u003c/p>\n    \u003c/section>\n\n    \u003csection class=\"glass notes-widget\" id=\"notesWidget\">\n      \u003csmall class=\"label\">Notepad\u003c/small>\n      \u003ci data-lucide=\"file-text\">\u003c/i>\n      \u003ch3 id=\"noteTitle\">No Notes\u003c/h3>\n      \u003cp id=\"notePreview\">Tap to create your first note...\u003c/p>\n      \u003cfooter>\n        \u003csmall class=\"label\">Quick note\u003c/small>\n        \u003cbutton id=\"quickNote\">\u003ci data-lucide=\"plus\">\u003c/i>\u003c/button>\n      \u003c/footer>\n    \u003c/section>","preview":"Nothing to run yet.","run":false,"lines":22,"typed":20,"shot":null},{"n":21,"chapter":"Cleaner, notes and notifications","chapterIndex":4,"title":"Cleaner widget styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line. pathLength=\"100\" in the HTML lets the ring's progress go from 0 to 100.","code":"\n/* ---- Cleaner ---- */\n\n.cleaner {\n  display: grid;\n  place-items: center;\n  align-content: center;\n  gap: 16px;\n}\n\n.ring {\n  position: relative;\n  width: 112px;\n  height: 112px;\n  display: grid;\n  place-items: center;\n  font-size: 30px;\n}\n\n.ring svg {\n  position: absolute;\n  inset: 0;\n  rotate: -90deg;\n}\n\n.ring circle {\n  fill: none;\n  stroke: rgba(255, 255, 255, 0.16);\n  stroke-width: 7;\n}\n\n#ring {\n  stroke: #fff;\n  stroke-linecap: round;\n  stroke-dasharray: 100;\n  stroke-dashoffset: 100;\n  transition: stroke-dashoffset 0.25s;\n}\n\n.ring::before {\n  content: \"\";\n  position: absolute;\n  inset: 16px;\n  border-radius: 50%;\n  background: radial-gradient(circle, rgba(255, 255, 255, 0.45), transparent 70%);\n  opacity: 0;\n  transition: opacity 0.5s;\n  animation: pulse 1.2s ease-in-out infinite alternate;\n}\n\n.busy .ring::before {\n  opacity: 1;\n}\n\n.ring .lucide {\n  position: relative;\n}\n\n#cleanText {\n  font-size: 14px;\n  font-weight: 600;\n}\n\n@keyframes pulse {\n  to { scale: 1.3; }\n}","preview":"Nothing to run yet.","run":false,"lines":66,"typed":55,"shot":null},{"n":22,"chapter":"Cleaner, notes and notifications","chapterIndex":4,"title":"Notes widget styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Notes widget ---- */\n\n.notes-widget {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n}\n\n.label {\n  font-size: 10px;\n  f x;\n  padding: 12px 14px;\n  border-radius: 18px;\n  font-size: 13px;\n  background: rgba(40, 40, 44, 0.55);\n  backdrop-filter: blur(40px) saturate(180%);\n  border: 1px solid rgba(255, 255, 255, 0.14);\n  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);\n  animation: slide-in 0.6s cubic-bezier(0.2, 1.3, 0.4, 1);\n  transition: 0.5s;\n}\n\n.toast img {\n  width: 36px;\n}\n\n.toast p {\n  color: var(--muted);\n}\n\n.toast.hide {\n  opacity: 0;\n  translate: 120% 0;\n}\n\n@keyframes slide-in {\n  from { translate: 120% 0; }\n}","preview":"Nothing to run yet.","run":false,"lines":44,"typed":37,"shot":null},{"n":25,"chapter":"Cleaner, notes and notifications","chapterIndex":4,"title":"Notifications and the cleaner","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line.","code":"\n// ---- Notifications ----\n\nfunction notify(app, title, text) {\n  const toast = document.createElement(\"div\");\n  toast.className = \"toast\";\n  toast.innerHTML = `\u003cimg src=\"icons/${app}.svg\" alt=\"\">\u003cdiv>\u003cb>${title}\u003c/b>\u003cp>${text}\u003c/p>\u003c/div>`;\n  $(\"toasts\").append(toast);\n  setTimeout(() => toast.classList.add(\"hide\"), 4000);\n  setTimeout(() => toast.remove(), 4500);\n}\n\n// ---- Cleaner ----\n\nlet cleaning = false;\n\nfunction clean() {\n  if (cleaning) return;\n  cleaning = true;\n  let progress = 0;\n  $(\"cleaner\").classList.add(\"busy\");\n  const timer = setInterval(() => {\n    progress = Math.min(100, progress + Math.random() * 4);\n    $(\"ring\").style.strokeDashoffset = 100 - progress;\n    $(\"cleanText\").textContent = `Cleaning... ${Math.floor(progress)}%`;\n    if (progress \u003c 100) return;\n    clearInterval(timer);\n    const freed = (1 + Math.random() * 3).toFixed(1);\n    $(\"cleaner\").classList.remove(\"busy\");\n    $(\"cleanText\").textContent = freed + \" GB freed\";\n    notify(\"trash\", \"All clean\", `${freed} GB of junk files removed.`);\n    cleaning = false;\n  }, 60);\n}\n\n$(\"cleaner\").addEventListener(\"click\", clean);","preview":"Click the cleaner: a soft white light pulses inside the ring while it fills up and counts to 100%. Then a notification slides in from the right: All clean.","run":true,"lines":36,"typed":30,"shot":"shots/step25.jpg"},{"n":26,"chapter":"The dock","chapterIndex":5,"title":"Dock markup","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003c!-- The dock: script.js fills it with app icons -->\n  \u003cnav class=\"dock glass\" id=\"dock\">\u003c/nav>\n","preview":"Nothing to run yet.","run":false,"lines":3,"typed":2,"shot":null},{"n":27,"chapter":"The dock","chapterIndex":5,"title":"Dock styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line. --size is how big each icon is. JavaScript changes it when the mouse is near.","code":"\n/* ---- Dock ---- */\n\n.dock {\n  position: fixed;\n  bottom: 8px;\n  left: 50%;\n  translate: -50% 0;\n  z-index: 10;\n  height: 70px;\n  padding: 0 8px 8px;\n  display: flex;\n  align-items: flex-end;\n  gap: 6px;\n  border-radius: 22px;\n}\n\n.app {\n  position: relative;\n  width: var(--size, 54px);\n  height: var(--size, 54px);\n  transition: width 0.15s, height 0.15s;\n}\n\n.app img {\n  width: 100%;\n  filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));\n}","preview":"Nothing to run yet.","run":false,"lines":28,"typed":24,"shot":null},{"n":28,"chapter":"The dock","chapterIndex":5,"title":"Name tags and the open-app dot","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n.app::before {\n  content: attr(data-name);\n  position: absolute;\n  bottom: calc(100% + 12px);\n  left: 50%;\n  translate: -50% 0;\n  padding: 4px 11px;\n  border-radius: style.setProperty(\"--size\", 54 + 30 * grow + \"px\");\n  }\n});\n\ndock.addEventListener(\"mouseleave\", () => {\n  for (const icon of dock.querySelectorAll(\".app\")) icon.style.removeProperty(\"--size\");\n});","preview":"A glass dock with seven app icons. Move the mouse along it: the icons swell around the pointer like a real Mac, and each one shows its name.","run":true,"lines":36,"typed":29,"shot":"shots/step29.jpg"},{"n":30,"chapter":"Windows","chapterIndex":6,"title":"The Finder window","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line. A \u003ctemplate> is not shown. JavaScript copies it into a window.","code":"  \u003c!-- App windows open in here -->\n  \u003cdiv id=\"windows\">\u003c/div>\n\n  \u003c!-- What goes inside each app window -->\n  \u003ctemplate id=\"finder-app\">\n    \u003caside class=\"sidebar\">\n      \u003csmall>Favourites\u003c/small>\n      \u003cbutton>\u003ci data-lucide=\"clock\">\u003c/i>Recents\u003c/button>\n      \u003cbutton>\u003ci data-lucide=\"layout-grid\">\u003c/i>Applications\u003c/button>\n      \u003cbutton class=\"active\">\u003ci data-lucide=\"monitor\">\u003c/i>Desktop\u003c/button>\n      \u003cbutton>\u003ci data-lucide=\"file-text\">\u003c/i>Documents\u003c/button>\n      \u003cbutton>\u003ci data-lucide=\"circle-arrow-down\">\u003c/i>Downloads\u003c/button>\n    \u003c/aside>\n    \u003cdiv class=\"files\">\n      \u003cfigure>\u003cimg src=\"icons/folder.svg\" alt=\"\">\u003cfigcaption>Projects\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cimg src=\"icons/folder.svg\" alt=\"\">\u003cfigcaption>Screenshots\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cimg src=\"icons/folder.svg\" alt=\"\">\u003cfigcaption>Music\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cimg src=\"icons/html.svg\" alt=\"\">\u003cfigcaption>index.html\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cimg src=\"icons/css.svg\" alt=\"\">\u003cfigcaption>style.css\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cimg src=\"icons/js.svg\" alt=\"\">\u003cfigcaption>script.js\u003c/figcaption>\u003c/figure>\n    \u003c/div>\n  \u003c/template>\n","preview":"Nothing to run yet.","run":false,"lines":23,"typed":21,"shot":null},{"n":31,"chapter":"Windows","chapterIndex":6,"title":"Window frame","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Windows ---- */\n\n#windows {\n  position: relative;\n  z-index: 1;\n}\n\n.window {\n  position: fixed;\n  width: 680px;\n  height: 430px;\n  display: flex;\n  flex-direction: column;\n  border-radius: 12px;\n  overflow: hidden;\n  font-size: 13px;\n  background: rgba(36, 36, 40, 0.8);\n  backdrop-filter: blur(60px) saturate(190%);\n  box-shadow:\n    0 0 0 0.5px rgba(0, 0, 0, 0.8),\n    inset 0 0 0 1px rgba(255, 255, 255, 0.12),\n    0 28px 70px rgba(0, 0, 0, 0.55);\n  animation: open-window 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);\n  transition: left 0.3s, top 0.3s, width 0.3s, height 0.3s, transform 0.5s, opacity 0.5s;\n}\n\n.window.dragging {\n  transition: none;\n}","preview":"Nothing to run yet.","run":false,"lines":30,"typed":26,"shot":null},{"n":32,"chapter":"Windows","chapterIndex":6,"title":"Title bar and traffic lights","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n.titlebar {\n  position: relative;\n  height: 38px;\n  flex-shrink: 0;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-weight: 600;\n  color: var(--muted);\n}\n\n.lights {\n  position: absolute;\n  left: 13px;\n  display: flex;\n  gap: 8px;\n}\n\n.lights button {\n  width: 12px;\n  height: 12px;\n  display: grid;\n  place-items: center;\n  border-radius: 50%;\n  font-size: 9px;\n  color: rgba(0,  hidden;\n  text-overflow: ellipsis;\n}\n\n.sidebar .lucide {\n  flex-shrink: 0;\n  font-size: 15px;\n  color: var(--blue);\n}\n\n.sidebar .active {\n  background: rgba(255, 255, 255, 0.12);\n}\n\n/* ---- Finder ---- */\n\n.files {\n  flex: 1;\n  padding: 22px;\n  display: grid;\n  grid-template-columns: repeat(auto-fill, 96px);\n  align-content: start;\n  gap: 16px 10px;\n  background: #1e1e20;\n}\n\n.files figure {\n  display: grid;\n  justify-items: center;\n  gap: 4px;\n  padding: 8px 2px 6px;\n  border-radius: 8px;\n}\n\n.files figure:hover {\n  background: rgba(255, 255, 255, 0.08);\n}\n\n.files img {\n  width: 58px;\n  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));\n}\n\n.files figcaption {\n  font-size: 12px;\n}","preview":"Nothing to run yet.","run":false,"lines":74,"typed":62,"shot":null},{"n":35,"chapter":"Windows","chapterIndex":6,"title":"Open a window","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line. Leave out nothing: the missing check at the top of openWindow is bug 3.","code":"\ndock.addEventListener(\"click\", (e) => {\n  const icon = e.target.closest(\".app\");\n  if (!icon) return;\n  icon.animate(\n    [{ translate: \"0 0\" }, { translate: \"0 -22px\" }, { translate: \"0 0\" }],\n    { duration: 450, iterations: 2, easing: \"ease-in-out\" },\n  );\n  openApp(icon.dataset.app);\n});\n\n// ---- Windows ----\n\nconst SETUP = {};   // what each app does when its window opens\nlet topZ = 1;\n\nfunction openApp(id) {\n  if (id === \"weather\") return loadWeather(true);\n  if (id === \"trash\") return clean();\n  openWindow(id);\n}\n\nfunction openWindow(id) {\n  const template = $(id + \"-app\");\n  if (!template) return;\n\n  const win = document.createElement(\"section\");\n  win.className = \"window\";\n  win.dataset.app = id;\n  win.innerHTML = `\n    \u003cheader class=\"titlebar\">\n      \u003cdiv class=\"lights\">\n        \u003cbutton class=\"close\">\u003ci data-lucide=\"x\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"minimize\">\u003ci data-lucide=\"minus\">\u003c/i>\u003c/button>\n        \u003cbutton class=\"maximize\">\u003ci data-lucide=\"maximize-2\">\u003c/i>\u003c/button>\n      \u003c/div>\n      \u003cspan>${APPS.find((app) => app.id === id)?.name ?? \"\"}\u003c/span>\n    \u003c/header>\n    \u003cdiv class=\"content\">\u003c/div>`;\n  win.querySelector(\".content\").append(template.content.cloneNode(true));\n  $(\"windows\").append(win);\n\n  // Open in the middle of the screen, a little lower for each open window\n  const offset = document.querySelectorAll(\".window\").length * 26;\n  win.style.left = (innerWidth - win.offsetWidth) / 2 + offset + \"px\";\n  win.style.top = (innerHeight - win.offsetHeight) / 2 - 40 + offset + \"px\";\n\n  win.querySelector(\".close\").onclick = () => closeWindow(win);\n  win.querySelector(\".minimize\").onclick = () => minimizeWindow(win);\n  win.querySelector(\".maximize\").onclick = () => win.classList.toggle(\"maximized\");\n  win.querySelector(\".titlebar\").ondblclick = () => win.classList.toggle(\"maximized\");\n  win.addEventListener(\"pointerdown\", () => focusWindow(win));\n  makeDraggable(win);\n  SETUP[id]?.(win);\n  lucide.createIcons();\n  dockIcon(id)?.classList.add(\"open\");\n  focusWindow(win);\n}","preview":"Nothing to run yet. One more step.","run":false,"lines":58,"typed":50,"shot":null},{"n":36,"chapter":"Windows","chapterIndex":6,"title":"Focus, close, minimise and drag","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line.","code":"\nfunction focusWindow(win) {\n  win.classList.remove(\"minimized\");\n  win.style.zIndex = ++topZ;\n  for (const other of document.querySelectorAll(\".window\")) {\n    other.classList.toggle(\"active\", other === win);\n  }\n  $(\"appName\").textContent = win.querySelector(\".titlebar span\").textContent || \"Finder\";\n}\n\nfunction closeWindow(win) {\n  if (!win) return;\n  win.classList.add(\"closing\");\n  setTimeout(() => win.remove(), 200);\n  dockIcon(win.dataset.app)?.classList.remove(\"open\");\n  $(\"appName\").textContent = \"Finder\";\n}\n\n// Shrink the window into its dock icon\nfunction minimizeWindow(win) {\n  const from = win.getBoundingClientRect();\n  const to = (dockIcon(win.dataset.app) || dock).getBoundingClientRect();\n  win.style.setProperty(\"--to-x\", to.x + to.width / 2 - (from.x + from.width / 2) + \"px\");\n  win.style.setProperty(\"--to-y\", to.y - (from.y + from.height / 2) + \"px\");\n  win.classList.add(\"minimized\");\n  $(\"appName\").textContent = \"Finder\";\n}\n\nfunction makeDraggable(win) {\n  const bar = win.querySelector(\".titlebar\");\n  bar.addEventListener(\"pointerdown\", (e) => {\n    if (e.target.closest(\"button\")) return;\n    const dx = e.clientX - win.offsetLeft;\n    const dy = e.clientY - win.offsetTop;\n    win.classList.add(\"dragging\");\n    bar.setPointerCapture(e.pointerId);\n    bar.onpointermove = (e) => {\n      win.style.left = e.clientX - dx + \"px\";\n      win.style.top = Math.max(28, e.clientY - dy) + \"px\";   // never under the menu bar\n    };\n    bar.onpointerup = () => {\n      bar.onpointermove = null;\n      win.classList.remove(\"dragging\");\n    };\n  });\n}\n\n// ---- Finder ----\n\nSETUP.finder = function (win) {\n  const items = win.querySelectorAll(\".sidebar button\");\n  for (const item of items) {\n    item.onclick = () => {\n      items.forEach((other) => other.classList.toggle(\"active\", other === item));\n    };\n  }\n};","preview":"Click Finder in the dock: it bounces and a Finder window zooms open, with a sidebar and your project files. Drag it by the title bar. Bug 3: click Finder again and a second window opens on top.","run":true,"lines":57,"typed":51,"shot":"shots/step36.jpg"},{"n":37,"chapter":"Windows","chapterIndex":6,"title":"Bug 3: one window per app","file":"script.js","op":"insert_after_line","anchor":"function openWindow(id) {","where":"At the top of openWindow, right below its first line. If the app already has a window, bring that one forward instead.","code":"  const open = document.querySelector(`.window[data-app=\"${id}\"]`);\n  if (open) return focusWindow(open);","preview":"Click Finder as often as you like: one window. Click the yellow light: the window shrinks into its dock icon. Click the dock icon: it comes back.","run":true,"lines":2,"typed":2,"shot":"shots/step37.jpg"},{"n":38,"chapter":"Notes app","chapterIndex":7,"title":"Notes window","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003ctemplate id=\"notes-app\">\n    \u003caside class=\"sidebar\">\n      \u003cbutton class=\"new-note\">\u003ci data-lucide=\"square-pen\">\u003c/i>New Note\u003c/button>\n      \u003cdiv class=\"note-list\">\u003c/div>\n    \u003c/aside>\n    \u003ctextarea placeholder=\"Start typing...\">\u003c/textarea>\n  \u003c/template>\n","preview":"Nothing to run yet.","run":false,"lines":8,"typed":7,"shot":null},{"n":39,"chapter":"Notes app","chapterIndex":7,"title":"Notes styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Notes app ---- */\n\n.sidebar .new-note {\n  margin-bottom: 6px;\n  font-weight: 600;\n  color: #ffc400;\n}\n\n.new-note .lucide {\n  color: #ffc400;\n}\n\n.note-list .active {\n  background: rgba(255, 196, 0, 0.32);\n}\n\n.window textarea {\n  flex: 1;\n  padding: 18px 24px;\n  border: none;\n  outline: none;\n  resize: none;\n  font: inherit;\n  font-size: 15px;\n  line-height: 1.6;\n  color: var(--text);\n  background: #1e1e20;\n}","preview":"Nothing to run yet.","run":false,"lines":29,"typed":24,"shot":null},{"n":40,"chapter":"Notes app","chapterIndex":7,"title":"Notes that are saved","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line. localStorage keeps the notes after a reload.","code":"\n// ---- Notes ----\n\nlet notes = JSON.parse(localStorage.getItem(\"notes\") || \"[]\");   // newest first\nlet current = 0;\n\nfunction saveNotes() {\n  localStorage.setItem(\"notes\", JSON.stringify(notes));\n  const [title, ...lines] = (notes[0] ?? \"\").split(\"\\n\");\n  $(\"noteTitle\").textContent = notes.length ? title || \"New Note\" : \"No Notes\";\n  $(\"notePreview\").textContent = notes.length\n    ? lines.join(\" \") || \"No additional text\"\n    : \"Tap to create your first note...\";\n}\n\nsaveNotes();\n\nSETUP.notes = function (win) {\n  const list = win.querySelector(\".note-list\");\n  const editor = win.querySelector(\"textarea\");\n  if (!notes.length) notes.push(\"\");\n\n  function show() {\n    list.innerHTML = \"\";\n    notes.forEach((note, i) => {\n      const item = document.createElement(\"button\");\n      item.textContent = note.split(\"\\n\")[0] || \"New Note\";\n      item.classList.toggle(\"active\", i === current);\n      item.onclick = () => {\n        current = i;\n        show();\n      };\n      list.append(item);\n    });\n    editor.value = notes[current];\n  }\n\n  win.querySelector(\".new-note\").onclick = () => {\n    if (notes[0]) notes.unshift(\"\");\n    current = 0;\n    show();\n    editor.focus();\n  };\n\n  editor.oninput = () => {\n    notes[current] = editor.value;\n    list.children[current].textContent = editor.value.split(\"\\n\")[0] || \"New Note\";\n    saveNotes();\n  };\n\n  show();\n};\n\nfunction newNote() {\n  openWindow(\"notes\");\n  document.querySelector(`.window[data-app=\"notes\"] .new-note`).click();\n}\n\n$(\"notesWidget\").onclick = () => openWindow(\"notes\");\n$(\"quickNote\").onclick = (e) => {\n  e.stopPropagation();\n  newNote();\n};","preview":"Click + on the notepad widget and type. The Notes window saves as you type, and the widget shows your newest note. Reload the page: your notes are still there.","run":true,"lines":63,"typed":52,"shot":"shots/step40.jpg"},{"n":41,"chapter":"Terminal","chapterIndex":8,"title":"Terminal window","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003ctemplate id=\"terminal-app\">\n    \u003cdiv class=\"term-output\">\u003c/div>\n    \u003clabel class=\"term-line\">guest@macbook ~ % \u003cinput spellcheck=\"false\">\u003c/label>\n  \u003c/template>\n","preview":"Nothing to run yet.","run":false,"lines":5,"typed":4,"shot":null},{"n":42,"chapter":"Terminal","chapterIndex":8,"title":"Terminal styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Terminal ---- */\n\n.window[data-app=\"terminal\"] {\n  width: 620px;\n  height: 380px;\n}\n\n.window[data-app=\"terminal\"] .content {\n  display: block;\n  padding: 8px 14px;\n  overflow-y: auto;\n  font: 13px/1.6 var(--mono);\n  background: rgba(14, 14, 16, 0.75);\n}\n\n.term-output div {\n  white-space: pre-wrap;\n}\n\n.term-line {\n  display: flex;\n  gap: 8px;\n  color: #6bdc8a;\n}\n\n.term-line input {\n  flex: 1;\n  border: none;\n  outline: none;\n  font: inherit;\n  color: var(--text);\n  background: none;\n}","preview":"Nothing to run yet.","run":false,"lines":34,"typed":28,"shot":null},{"n":43,"chapter":"Terminal","chapterIndex":8,"title":"Commands","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line. Each command is a function that returns the text to print.","code":"\n// ---- Terminal ----\n\n// Facts about this computer, from the browser\nfunction specs() {\n  return [\n    [\"Display\", `${screen.width} x ${screen.height}`],\n    [\"Processor\", navigator.hardwareConcurrency + \" cores\"],\n    [\"Memory\", (navigator.deviceMemory || \"?\") + \" GB\"],\n    [\"Language\", navigator.language],\n    [\"Time zone\", Intl.DateTimeFormat().resolvedOptions().timeZone],\n  ];\n}\n\nconst COMMANDS = {\n  help: () => \"Try: \" + Object.keys(COMMANDS).join(\", \"),\n  date: () => new Date().toString(),\n  whoami: () => \"guest\",\n  echo: (...words) => words.join(\" \"),\n  weather: () => `${CITY.name}: ${$(\"temp\").textContent}, ${$(\"skyText\").textContent}`,\n  neofetch: () => [\"guest@macbook\", \"-------------\"]\n    .concat(specs().map(([name, value]) => `${name}: ${value}`))\n    .join(\"\\n\"),\n  open: (id) => {\n    openApp(id);\n    return \"Opening \" + id + \"...\";\n  },\n};","preview":"Nothing to run yet.","run":false,"lines":28,"typed":25,"shot":null},{"n":44,"chapter":"Terminal","chapterIndex":8,"title":"A working terminal","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line.","code":"\nSETUP.terminal = function (win) {\n  const output = win.querySelector(\".term-output\");\n  const input = win.querySelector(\"input\");\n\n  function print(text) {\n    const line = document.createElement(\"div\");\n    line.textContent = text;\n    output.append(line);\n  }\n\n  print(\"Last login: \" + new Date().toDateString() + \" on ttys000\");\n  print('Type \"help\" to see what I can do.');\n\n  input.addEventListener(\"keydown\", (e) => {\n    if (e.key !== \"Enter\") return;\n    const [name, ...args] = input.value.trim().split(/\\s+/);\n    print(\"guest@macbook ~ % \" + input.value);\n    input.value = \"\";\n    if (name === \"clear\") output.innerHTML = \"\";\n    else if (COMMANDS[name]) print(COMMANDS[name](...args));\n    else if (name) print(\"zsh: command not found: \" + name);\n    win.querySelector(\".content\").scrollTop = 1e6;\n  });\n\n  win.addEventListener(\"click\", () => input.focus());\n  setTimeout(() => input.focus());\n};","preview":"Open Terminal from the dock and type neofetch, then weather. It prints facts about your real computer and the live weather.","run":true,"lines":28,"typed":23,"shot":"shots/step44.jpg"},{"n":45,"chapter":"Calculator","chapterIndex":9,"title":"Calculator keys","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line. &divide;, &times; and &minus; are HTML names for ÷, × and −.","code":"  \u003ctemplate id=\"calculator-app\">\n    \u003coutput class=\"screen\">0\u003c/output>\n    \u003cdiv class=\"keys\">\n      \u003cbutton class=\"fn\" data-key=\"C\">AC\u003c/button>\n      \u003cbutton class=\"fn\" data-key=\"N\">&plusmn;\u003c/button>\n      \u003cbutton class=\"fn\" data-key=\"%\">%\u003c/button>\n      \u003cbutton class=\"op\" data-key=\"/\">&divide;\u003c/button>\n      \u003cbutton data-key=\"7\">7\u003c/button>\n      \u003cbutton data-key=\"8\">8\u003c/button>\n      \u003cbutton data-key=\"9\">9\u003c/button>\n      \u003cbutton class=\"op\" data-key=\"*\">&times;\u003c/button>\n      \u003cbutton data-key=\"4\">4\u003c/button>\n      \u003cbutton data-key=\"5\">5\u003c/button>\n      \u003cbutton data-key=\"6\">6\u003c/button>\n      \u003cbutton class=\"op\" data-key=\"-\">&minus;\u003c/button>\n      \u003cbutton data-key=\"1\">1\u003c/button>\n      \u003cbutton data-key=\"2\">2\u003c/button>\n      \u003cbutton data-key=\"3\">3\u003c/button>\n      \u003cbutton class=\"op\" data-key=\"+\">+\u003c/button>\n      \u003cbutton class=\"zero\" data-key=\"0\">0\u003c/button>\n      \u003cbutton data-key=\".\">.\u003c/button>\n      \u003cbutton class=\"op\" data-key=\"=\">=\u003c/button>\n    \u003c/div>\n  \u003c/template>\n","preview":"Nothing to run yet.","run":false,"lines":25,"typed":24,"shot":null},{"n":46,"chapter":"Calculator","chapterIndex":9,"title":"Calculator styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Calculator ---- */\n\n.window[data-app=\"calculator\"] {\n  width: 240px;\n  height: 400px;\n}\n\n.window[data-app=\"calculator\"] .content {\n  flex-direction: column;\n  padding: 0 12px 12px;\n}\n\n.screen {\n  flex: 1;\n  display: flex;\n  align-items: flex-end;\n  justify-content: flex-end;\n  padding: 0 6px 8px;\n  font-size: 46px;\n  font-weight: 300;\n  overflow: hidden;\n}\n\n.keys {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 8px;\n}\n\n.keys button {\n  height: 46px;\n  border-radius: 23px;\n  font-size: 20px;\n  background: rgba(255, 255, 255, 0.2);\n}\n\n.keys button:active {\n  filter: brightness(1.5);\n}\n\n.keys .fn {\n  font-size: 17px;\n  background: rgba(255, 255, 255, 0.38);\n}\n\n.keys .op {\n  font-size: 24px;\n  background: #ff9f0a;\n}\n\n.keys .zero {\n  grid-column: span 2;\n  padding-left: 19px;\n  text-align: left;\n}","preview":"Nothing to run yet.","run":false,"lines":56,"typed":46,"shot":null},{"n":47,"chapter":"Calculator","chapterIndex":9,"title":"Do the maths","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line.","code":"\n// ---- Calculator ----\n\n// Work out a sum like \"12*7+3\". Only digits and + - * / . ( ) get this far.\nfunction calculate(math) {\n  try {\n    return String(Number(Function(\"return \" + (math || 0))().toFixed(8)));\n  } catch {\n    return \"Error\";\n  }\n}\n\nSETUP.calculator = function (win) {\n  const screen = win.querySelector(\".screen\");\n  let math = \"\";    // what JavaScript works out, like 12*7\n  let shown = \"\";   // what you see on the screen, like 12×7\n\n  win.querySelector(\".keys\").addEventListener(\"click\", (e) => {\n    const key = e.target.dataset.key;\n    if (!key) return;\n    if (key === \"C\") math = shown = \"\";\n    else if (key === \"=\") math = shown = calculate(math);\n    else if (key === \"%\") math = shown = calculate(`(${math || 0})/100`);\n    else if (key === \"N\") math = shown = calculate(`-(${math || 0})`);\n    else {\n      math += key;\n      shown += e.target.textContent;\n    }\n    screen.textContent = shown || \"0\";\n  });\n};","preview":"Open Calculator from the dock and tap 1 2 × 7 =. It shows 84, with round orange keys just like the Mac.","run":true,"lines":31,"typed":27,"shot":"shots/step47.jpg"},{"n":48,"chapter":"Settings and About","chapterIndex":10,"title":"Settings and About windows","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003ctemplate id=\"settings-app\">\n    \u003cdiv class=\"settings\">\n      \u003ch3>Wallpaper\u003c/h3>\n      \u003cp>The shader repaints the desktop in a new colour.\u003c/p>\n      \u003cdiv class=\"swatches\">\u003c/div>\n    \u003c/div>\n  \u003c/template>\n\n  \u003ctemplate id=\"about-app\">\n    \u003cdiv class=\"about\">\n      \u003cdiv class=\"about-logo\">\u003ci data-lucide=\"command\">\u003c/i>\u003c/div>\n      \u003ch2>macOS\u003c/h2>\n      \u003cp>Web Edition 1.0\u003c/p>\n      \u003cdl>\u003c/dl>\n    \u003c/div>\n  \u003c/template>\n","preview":"Nothing to run yet.","run":false,"lines":17,"typed":15,"shot":null},{"n":49,"chapter":"Settings and About","chapterIndex":10,"title":"Settings styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Settings and About ---- */\n\n.window[data-app=\"settings\"] {\n  width: 560px;\n  height: 300px;\n}\n\n.settings {\n  flex: 1;\n  padding: 18px 28px;\n  background: #1e1e20;\n}\n\n.settings h3 {\n  font-size: 17px;\n}\n\n.settings p {\n  margin: 4px 0 18px;\n  color: var(--muted);\n}\n\n.swatches {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 16px;\n}\n\n.swatch {\n  d { name: \"Aurora\", hue: 290 },\n];\nlet wallpaper = 0;\n\nfunction setWallpaper(i) {\n  wallpaper = i % WALLPAPERS.length;\n  document.body.style.setProperty(\"--hue\", WALLPAPERS[wallpaper].hue + \"deg\");\n  localStorage.setItem(\"wallpaper\", wallpaper);\n  document.querySelectorAll(\".swatch\").forEach((swatch, j) => {\n    swatch.classList.toggle(\"active\", j === wallpaper);\n  });\n}\n\nsetWallpaper(Number(localStorage.getItem(\"wallpaper\")) || 0);\n\nSETUP.settings = function (win) {\n  win.querySelector(\".swatches\").innerHTML = WALLPAPERS.map((paper, i) => `\n    \u003cbutton class=\"swatch\" style=\"--hue: ${paper.hue}deg\" onclick=\"setWallpaper(${i})\">\n      \u003cspan>\u003c/span>${paper.name}\n    \u003c/button>`).join(\"\");\n  setWallpaper(wallpaper);\n};\n\n// ---- About This Mac ----\n\nSETUP.about = function (win) {\n  win.querySelector(\"dl\").innerHTML = specs()\n    .map(([name, value]) => `\u003cdt>${name}\u003c/dt>\u003cdd>${value}\u003c/dd>`)\n    .join(\"\");\n};","preview":"Open System Settings from the dock and pick Aurora: the whole desktop fades from midnight blue to green in a second and a half, glass and all.","run":true,"lines":37,"typed":30,"shot":"shots/step51.jpg"},{"n":52,"chapter":"Spotlight and menus","chapterIndex":11,"title":"Spotlight markup","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003c!-- Spotlight search -->\n  \u003cdiv class=\"spotlight\" id=\"spotlight\" hidden>\n    \u003clabel class=\"search\">\n      \u003ci data-lucide=\"search\">\u003c/i>\n      \u003cinput id=\"spotInput\" placeholder=\"Spotlight Search\" autocomplete=\"off\" spellcheck=\"false\">\n    \u003c/label>\n    \u003cul class=\"results\" id=\"results\">\u003c/ul>\n  \u003c/div>\n","preview":"Nothing to run yet.","run":false,"lines":9,"typed":8,"shot":null},{"n":53,"chapter":"Spotlight and menus","chapterIndex":11,"title":"Spotlight styles","file":"style.css","op":"append","anchor":null,"where":"At the end of style.css. Start with an empty line.","code":"\n/* ---- Spotlight ---- */\n\n.spotlight {\n  position: fixed;\n  inset: 0;\n  z-index: 30;\n  padding-top: 20vh;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 8px;\n}\n\n.search,\n.results {\n  width: 660px;\n  border-radius: 18px;\n  background: rgba(30, 30, 34, 0.8);\n  backdrop-filter: blur(60px) saturate(190%);\n  border: 1px solid rgba(255, 255, 255, 0.14);\n  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);\n}\n\n.search {\n  height: 58px;\n  padding: 0 18px;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 22px;\n}\n\n.search .lucide {\n  color: var(--muted);\n}\n\n.search input {\n  flex: 1;\n  border: none;\n  outline: none;\n  font: inherit;\n  font-weight: 300;\n  color: var(--text);\n  background: none;\n}\n\n.search input::placeholder {\n  color: rgba(255, 255, 255, 0.4);\n}\n\n.results {\n  padding: 8px;\n  list-style: none;\n}\n\n.results:empty {\n  display: none;\n}\n\n.results li {\n  display: flex;\n  align-items: center;\n  gap: 12px;\n  padding: 7px 10px;\n  border-radius: 10px;\n  font-size: 15px;\n}\n\n.results li:first-child {\n  color: #fff;\n  background: var(--blue);\n}\n\n.results img {\n  width: 30px;\n}\n\n.results .answer {\n  font-size: 30px;\n  font-weight: 300;\n}","preview":"Nothing to run yet.","run":false,"lines":82,"typed":69,"shot":null},{"n":54,"chapter":"Spotlight and menus","chapterIndex":11,"title":"Search apps and do sums","file":"script.js","op":"append","anchor":null,"where":"At the end of script.js. Start with an empty line.","code":"\n// ---- Spotlight (Cmd+K) ----\n\nconst spotInput = $(\"spotInput\");\n\nfunction toggleSpotlight(show = $(\"spotlight\").hidden) {\n  $(\"spotlight\").hidden = !show;\n  if (!show) return;\n  spotInput.value = \"\";\n  search();\n  spotInput.focus();\n}\n\nfunction search() {\n  const query = spotInput.value.trim();\n  let html = \"\";\n\n  // Maths, like 12 * 7\n  if (/^[\\d\\s.+\\-*/()]+$/.test(query) && /\\d/.test(query)) {\n    html += `\u003cli class=\"answer\">= ${calculate(query)}\u003c/li>`;\n  }\n\n  for (const app of APPS) {\n    if (!app.name.toLowerCase().includes(query.toLowerCase())) continue;\n    html += `\u003cli data-app=\"${app.id}\">\u003cimg src=\"icons/${app.id}.svg\" alt=\"\">${app.name}\u003c/li>`;\n  }\n  $(\"results\").innerHTML = html;\n}\n\nspotInput.addEventListener(\"input\", search);\n\nspotInput.addEventListener(\"keydown\", (e) => {\n  if (e.key === \"Enter\") $(\"results\").querySelector(\"[data-app]\")?.click();\n});\n\n$(\"results\").addEventListener(\"click\", (e) => {\n  const item = e.target.closest(\"[data-app]\");\n  if (!item) return;\n  toggleSpotlight(false);\n  openApp(item.dataset.app);\n});\n\n$(\"spotlight\").addEventListener(\"click\", (e) => {\n  if (e.target.id === \"spotlight\") toggleSpotlight(false);\n});\n\n$(\"searchButton\").addEventListener(\"click\", () => toggleSpotlight());\n\ndocument.addEventListener(\"keydown\", (e) => {\n  if ((e.metaKey || e.ctrlKey) && e.key === \"k\") {\n    e.preventDefault();\n    toggleSpotlight();\n  }\n  if (e.key === \"Escape\") toggleSpotlight(false);\n});","preview":"Press ⌘K and type 12 * 7 + 3: Spotlight answers 87. Type ter and press Enter: Terminal opens. Esc closes it.","run":true,"lines":55,"typed":43,"shot":"shots/step54.jpg"},{"n":55,"chapter":"Spotlight and menus","chapterIndex":11,"title":"Menu markup","file":"index.html","op":"insert_before_line","anchor":"  \u003cscript src=\"https://unpkg.com/lucide@1.48.0/dist/umd/lucide.min.js\">\u003c/script>","where":"In index.html, right above the first \u003cscript> line. End with an empty line.","code":"  \u003c!-- Drop-down and right-click menus -->\n  \u003cdiv class=\"menu\" id=\"menu\" hidden>\u003c/div>\n","preview":"Nothing to run yet.
